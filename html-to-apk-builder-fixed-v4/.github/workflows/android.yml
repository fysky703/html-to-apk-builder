name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string
        default: "My Web App"
      package_name:
        description: "Android package name"
        required: true
        type: string
        default: "com.example.mywebapp"
      source_mode:
        description: "url or html"
        required: false
        type: string
        default: "html"
      web_url:
        description: "Website URL (URL mode only)"
        required: false
        type: string
        default: ""
      source_commit:
        description: "Exact HTML commit SHA"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit != '' && inputs.source_commit || github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Update application metadata
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          app_name = os.environ["APP_NAME"].replace('"', '')[:40]
          package_name = os.environ["PACKAGE_NAME"]

          manifest = Path("app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = re.sub(r'android:label="[^"]*"', f'android:label="{app_name}"', text)
              manifest.write_text(text)

          gradle = Path("app/build.gradle")
          if gradle.exists():
              text = gradle.read_text()
              text = re.sub(
                  r'applicationId\s+"[^"]+"',
                  f'applicationId "{package_name}"',
                  text
              )
              gradle.write_text(text)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare artifact
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APP_NAME}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk
          path: dist/*.apk
          retention-days: 3
