name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "My Web App"
      package_name:
        description: "Android package name"
        required: true
        default: "com.example.mywebapp"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Update app metadata
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          name = os.environ["APP_NAME"].replace('"','').replace('\n',' ')[:40]
          pkg = os.environ["PACKAGE_NAME"]
          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', f'android:label="{name}"', s)
          p.write_text(s)
          p = pathlib.Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{pkg}"', s)
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ inputs.app_name }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk
          path: dist/*.apk
          retention-days: 3
