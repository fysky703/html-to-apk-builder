<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Or URL → APK Builder</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="glass">
<h1>HTML Or URL Site → APK Builder</h1>

<div class="row">
  <button type="button" id="urlMode" class="active">Website URL</button>
  <button type="button" id="htmlMode">Upload HTML</button>
</div>

<form id="buildForm">
  <label>App Name</label>
  <input id="appName" value="My Web App" required>

  <label>Package Name</label>
  <input id="packageName" value="com.example.mywebapp" required>

  <section id="urlBox">
    <label>Website URL</label>
    <input id="url" placeholder="https://example.com">
  </section>

  <section id="htmlBox" hidden>
    <label>Upload HTML</label>
    <input id="htmlFile" type="file" accept=".html,.htm,text/html">
  </section>

  <label>Upload App Icon</label>
  <input type="file" accept="image/png,image/jpeg">

  <label>Splash Screen</label>
  <select>
    <option>Image</option>
    <option>Video</option>
    <option>Video URL</option>
    <option>HTML Animation</option>
  </select>

  <div class="grid">
    <div><label>Version</label><input value="1.0"></div>
    <div><label>Build</label><input value="1" type="number" min="1"></div>
  </div>

  <label>Application Licensing</label>
  <div class="permissions">
    <label><input type="checkbox" checked> INTERNET</label>
    <label><input type="checkbox"> CAMERA</label>
    <label><input type="checkbox"> RECORD_AUDIO</label>
    <label><input type="checkbox"> VIBRATE</label>
  </div>

  <button class="build" type="submit">BUILD APK</button>
</form>

<pre id="status"></pre>
<a id="download" hidden>DOWNLOAD APK</a>
</main>
<script src="/app.js"></script>
</body>
</html>
